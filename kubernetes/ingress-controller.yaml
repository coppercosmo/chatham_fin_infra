# Internal-only managed NGINX controller. The app routing add-on's default controller is public,
# so we add our own internal one and point every Ingress at it (ingressClassName: nginx-internal).
apiVersion: approuting.kubernetes.azure.com/v1alpha1
kind: NginxIngressController
metadata:
  name: nginx-internal
spec:
  ingressClassName: nginx-internal
  controllerNamePrefix: nginx-internal
  loadBalancerAnnotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "snet-aks"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "<aks_ingress_internal_ip>" # e.g. 10.100.8.250
