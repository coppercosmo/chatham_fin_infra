# Cilium enforces standard Kubernetes NetworkPolicy. Default deny, then open only what the app needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: advisor
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: advisor-api
  namespace: advisor
spec:
  podSelector:
    matchLabels: { app: advisor-api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: # only the managed NGINX controller
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: app-routing-system }
      ports:
        - port: 8080
  egress:
    - to: # cluster DNS
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to: # Entra ID token endpoint and private endpoints; the hub firewall allow-lists FQDNs
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 443, protocol: TCP }
